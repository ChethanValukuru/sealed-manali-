<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The problem: a shared space lets the attack leak to the defenders</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="240" fill="#f6f5f1"/>
  <rect x="40" y="34" width="600" height="150" rx="14" fill="none" stroke="#c9c4b8" stroke-width="1" stroke-dasharray="6 6"/>
  <text x="56" y="56" font-size="12" fill="#5e666d">one shared space</text>

  <rect x="70" y="78" width="150" height="56" rx="8" fill="#ffffff" stroke="#d9d5cb"/>
  <text x="145" y="102" font-size="14" font-weight="600" fill="#22272b" text-anchor="middle">Attackers</text>
  <text x="145" y="120" font-size="12" fill="#5e666d" text-anchor="middle">try to trick the AI</text>

  <rect x="265" y="78" width="150" height="56" rx="8" fill="#ffffff" stroke="#d9d5cb"/>
  <text x="340" y="102" font-size="14" font-weight="600" fill="#22272b" text-anchor="middle">The AI</text>
  <text x="340" y="120" font-size="12" fill="#5e666d" text-anchor="middle">being tested</text>

  <rect x="460" y="78" width="150" height="56" rx="8" fill="#ffffff" stroke="#d9d5cb"/>
  <text x="535" y="102" font-size="14" font-weight="600" fill="#22272b" text-anchor="middle">Defenders</text>
  <text x="535" y="120" font-size="12" fill="#5e666d" text-anchor="middle">check the answer</text>

  <path d="M145 134 L145 160 L535 160 L535 138" fill="none" stroke="#b4564b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="212" font-size="13" fill="#9a4a40" text-anchor="middle">the attack leaks across — so the result can't be trusted</text>
</svg>
